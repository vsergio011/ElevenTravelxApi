name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main  # Se ejecuta solo cuando haces push a la rama principal
    paths:
      - 'supabase/migrations/**' # Solo si hay cambios en las migraciones

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Migrations to Supabase
        run: |
          supabase login --access-token ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          supabase db push --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          # Estas variables vienen de los Secrets de tu repositorio en GitHub
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
